.t.ok{cursor:default}

.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}

AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA=";
let n=3,order=[],sel=-1,moves=0,t0=0,timer=null,won=false;
const board=document.getElementById('board'),mv=document.getElementById('mv'),tm=document.getElementById('tm'),msg=document.getElementById('msg');
document.getElementById('peek').style.backgroundImage='url('+IMG+')';
const sizes=document.getElementById('sizes');
[3,4,5].forEach(s=>{const b=document.createElement('button');b.className='b'+(s===n?' on':'');b.textContent=s+'×'+s;b.onclick=()=>{n=s;[...sizes.children].forEach(c=>c.classList.toggle('on',c===b));start()};sizes.appendChild(b)});
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function render(){
 board.style.gridTemplateColumns='repeat('+n+',1fr)';board.innerHTML='';
 order.forEach((p,i)=>{
  const d=document.createElement('button');d.className='t'+(i===sel?' sel':'')+(won?' ok':'');
  d.setAttribute('aria-label','piece '+(i+1));
  const r=Math.floor(p/n),c=p%n;
  d.style.backgroundImage='url('+IMG+')';
  d.style.backgroundSize=(n*100)+'% '+(n*100)+'%';
  d.style.backgroundPosition=(n>1?c*100/(n-1):0)+'% '+(n>1?r*100/(n-1):0)+'%';
  d.onclick=()=>tap(i);board.appendChild(d)});
 board.classList.toggle('done',won);
}
function tap(i){
 if(won)return;
 if(!t0){t0=Date.now();timer=setInterval(()=>tm.textContent=fmt(Math.floor((Date.now()-t0)/1000)),500)}
 if(sel<0){sel=i}else if(sel===i){sel=-1}else{
  [order[sel],order[i]]=[order[i],order[sel]];sel=-1;moves++;mv.textContent=moves;
  if(order.every((p,k)=>p===k)){won=true;clearInterval(timer);msg.textContent='Solved in '+moves+' moves, '+tm.textContent+'.'}}
 render();
}
function start(){
 clearInterval(timer);t0=0;moves=0;sel=-1;won=false;mv.textContent=0;tm.textContent='0:00';msg.textContent='';
 order=[...Array(n*n).keys()];
 do{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}while(order.every((p,k)=>p===k));
 render();
}
document.getElementById('shuf').onclick=start;
const pk=document.getElementById('pk'),peek=document.getElementById('peek');
['pointerdown'].forEach(e=>pk.addEventListener(e,()=>peek.style.display='block'));
['pointerup','pointerleave','pointercancel'].forEach(e=>pk.addEventListener(e,()=>peek.style.display='none'));
start();
